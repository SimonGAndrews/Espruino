name: XFSM

on:
  push:
    branches: [ '**' ]
    paths:
      - '.github/workflows/xfsm.yml'
      - 'boards/ESP32_IDF5.py'
      - 'libs/xfsm/**'
      - 'make/**'
      - 'scripts/**'
      - 'src/**'
      - 'targets/esp32/**'
      - 'Makefile'
  pull_request:
    branches: [ '**' ]
    paths:
      - '.github/workflows/xfsm.yml'
      - 'boards/ESP32_IDF5.py'
      - 'libs/xfsm/**'
      - 'make/**'
      - 'scripts/**'
      - 'src/**'
      - 'targets/esp32/**'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xfsm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux build and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: 3.9
      - name: Build without XFSM
        run: |
          env -u DEBUG make clean
          env -u DEBUG make USE_XFSM=0 -j2
      - name: Build with XFSM
        run: |
          env -u DEBUG make clean
          env -u DEBUG make USE_XFSM=1 -j2
      - name: Run XFSM JavaScript tests
        run: |
          for test in \
            test_shell.js \
            test_compile.js \
            test_diagnostics.js \
            test_runtime.js \
            test_completion.js \
            test_completion_cascade.js \
            test_targets.js \
            test_events_migration.js \
            test_profile1_diagnostics.js \
            test_context_ownership.js \
            test_assign_forms.js \
            test_context_diagnostics.js \
            test_transition_domains.js \
            test_transition_depth.js \
            test_lifecycle_complete.js \
            test_subscriber_complete.js \
            test_cross_actor_gc.js \
            test_runtime_errors.js \
            test_subscriptions.js \
            test_strict_validation.js \
            test_strict_validation_embedded.js \
            test_limits.js
          do
            bin/espruino --test "libs/xfsm/tests/$test"
          done
      - name: Run XFSM canonical trace tests
        run: |
          python3 libs/xfsm/tests/run_trace_test.py \
            libs/xfsm/tests/trace_api_002.js \
            libs/xfsm/tests/expected/api_002.ndjson
          python3 libs/xfsm/tests/run_trace_test.py \
            libs/xfsm/tests/trace_config_004.js \
            libs/xfsm/tests/expected/config_004.ndjson
          python3 libs/xfsm/tests/run_trace_test.py \
            libs/xfsm/tests/trace_config_005.js \
            libs/xfsm/tests/expected/config_005.ndjson
          python3 libs/xfsm/tests/run_trace_test.py \
            libs/xfsm/tests/trace_action_002.js \
            libs/xfsm/tests/expected/action_002.ndjson
          python3 libs/xfsm/tests/run_trace_test.py \
            libs/xfsm/tests/trace_snapshot_002.js \
            libs/xfsm/tests/expected/snapshot_002.ndjson
          python3 libs/xfsm/tests/run_trace_test.py \
            libs/xfsm/tests/trace_transition_005.js \
            libs/xfsm/tests/expected/transition_005.ndjson
          python3 libs/xfsm/tests/run_trace_test.py \
            libs/xfsm/tests/trace_diagnostic_006.js \
            libs/xfsm/tests/expected/diagnostic_006.ndjson
      - name: Run XFSM allocation-failure tests
        run: |
          env -u DEBUG make clean
          env -u DEBUG make USE_XFSM=1 XFC_TEST=1 -j2
          bin/espruino --test libs/xfsm/tests/test_fault_injection.js
      - name: Run native-format sanitizer tests
        run: make -C libs/xfsm/tests/native clean test
      - name: Audit XFSM static implementation contract
        run: python3 libs/xfsm/tests/audit_static_contract.py

  esp32-idf5:
    name: Original ESP32 IDF5 build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Provision and build with XFSM
        run: |
          source scripts/provision.sh ESP32_IDF5
          env -u DEBUG make BOARD=ESP32_IDF5 RELEASE=1 USE_XFSM=1 clean
          env -u DEBUG make BOARD=ESP32_IDF5 RELEASE=1 USE_XFSM=1 -j2
          xtensa-esp32-elf-nm --defined-only bin/build/espruino.elf \
            | grep -q 'jswrap_xfsm_createMachine'
          image_bytes=$(stat -c '%s' bin/build/espruino.bin)
          echo "XFSM ESP32_IDF5 app image: ${image_bytes} bytes" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload ESP32 IDF5 firmware
        uses: actions/upload-artifact@v7.0.0
        with:
          name: xfsm-esp32-idf5
          path: |
            bin/*.bin
            bin/*.tgz
